# Hexo 站点配置（博客本体）
# 主题配置在 _config.redefine.yml 里覆盖，主题默认值见仓库根目录的 _config.yml。

# Site
title: no9club
subtitle: ""
description: "no9club 的博客：记录学习、折腾与作品展示。"
keywords: no9club,博客,学习记录,作品展示
author: no9club
language: zh-CN
timezone: "Asia/Shanghai"

# URL —— 部署完成后改成你的正式域名（Cloudflare Pages 默认是 <project>.pages.dev）
url: https://no9club.pages.dev
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
marked:
  prependRoot: true
  postAsset: true
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# 站内搜索（本地搜索）的索引文件，由 hexo-generator-searchdb 生成
# 主题的搜索框会去请求 config.root + path，所以这里的 path 必须和下面保持一致
search:
  path: search.json
  field: post
  content: true
  format: striptags

# 加密文章（密码保护）的界面文案。
# 主题里内置的是 hexo-blog-encrypt 的移植版，默认文案全是英文，改这里即可全部换成中文。
# 只影响提示文字，和密码本身、加解密算法无关；不启用加密文章也可以留着不管。
# 注意：每条文案里都不要写半角双引号 "，它会被塞进 HTML 属性里，会截断页面。想用引号请用中文引号「」。
encrypt:
  # 首页/归档的文章列表里，那篇加密文章显示的摘要
  abstract: 这篇文章已加密，输入密码后继续阅读。
  # 密码输入框里的提示文字
  message: 请输入访问密码
  # 密码不对时的弹窗
  wrong_pass_message: 密码不对，请再试一次。
  # 密码对但内容校验没通过时的弹窗（正常不会出现）
  wrong_hash_message: 内容校验没通过，可能被改动过，但仍可继续查看。
  # 解锁成功后，正文末尾那个「重新上锁」按钮（点了会清掉记住的密码并刷新，等于重新锁上）
  again_message: 重新上锁

# Extensions
theme: redefine
