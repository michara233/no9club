# Hexo 站点配置（博客本体）
# 主题配置在 _config.redefine.yml 里覆盖，主题默认值见仓库根目录的 _config.yml。

# Site
title: no9club
subtitle: ""
description: "no9club 的博客：记录学习、折腾与作品展示。"
keywords: no9club,博客,学习记录,作品展示
author: no9club
language: zh-CN
timezone: "Asia/Shanghai"

# URL —— 部署完成后改成你的正式域名（Cloudflare Pages 默认是 <project>.pages.dev）
url: https://no9club.pages.dev
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
marked:
  prependRoot: true
  postAsset: true
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# 站内搜索（本地搜索）的索引文件，由 hexo-generator-searchdb 生成
# 主题的搜索框会去请求 config.root + path，所以这里的 path 必须和下面保持一致
search:
  path: search.json
  field: post
  content: true
  format: striptags

# Extensions
theme: redefine
