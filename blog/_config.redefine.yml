# 主题配置覆盖（Hexo 会把它深度合并到主题自带的 _config.yml 之上）
# 只写需要改的项即可，全部可选项见仓库根目录 _config.yml。

# 站点基本信息（导航栏标题、页脚作者等都用这里）
info:
  title: No9Club
  subtitle: 记录与分享游戏制作经验
  author: 第九艺术数字产品设计俱乐部
  url: https://no9club.pages.dev

# 图片资源：图片放在仓库根目录的主题 source/images/（主题自带图在那里），
# 或者放在 blog/source/images/（站点自己的图），两者构建后都在同一个 /images/ 路径下，配置里统一写 /images/文件名。
# 注意：像 defaults: / home_banner: 这种只写键、子项全被注释掉的写法，会把主题对应的整段配置
# 覆盖成 null，页面会渲染失败（Hexo 只打 ERROR 日志但退出码仍是 0）。要么整段注释，要么至少留一个子项。
defaults:
  # 站点头像（首页侧栏、文章页作者栏）
  avatar: /images/redefine-avatar.png
  # 浏览器标签页图标，默认 /images/redefine-favicon.svg
  favicon: /images/logo.png
  # 导航栏 logo，留空则不显示；填了会出现在站点标题左侧
  # logo: /images/logo.svg

# 首页横幅大图（light / dark 两套，按深浅色模式切换）
#  home_banner:
#   image:
#     light: /images/back.jpg
#     dark: /images/back.jpg

# 分享卡片（og:image）默认图，默认 /images/redefine-og.webp
# global:
#   open_graph:
#     image: /images/og.png

# 导航栏（路径对应 blog/source/ 下的页面，图标用 Font Awesome 类名）
navbar:
  links:
    Home:
      path: /
      icon: fa-regular fa-house
    归档:
      path: /archives
      icon: fa-regular fa-archive
    分类:
      path: /categories
      icon: fa-regular fa-folder
    标签:
      path: /tags
      icon: fa-regular fa-tags
  # 站内搜索（本地搜索）：索引由 hexo-generator-searchdb 生成，配置在 blog/_config.yml 的 search 段
  search:
    enable: true
    # 页面加载时预取搜索索引（搜索更快；文章多了想省流量可改 false）
    preload: true

# 首页横幅（hero）的标题、副标题与背景图
# 背景图浅色/深色模式各一张，只想用一张就两张填同一个路径；
# 图片放仓库根目录 source/images/ 或 blog/source/images/ 都行，路径统一写 /images/文件名。
home_banner:
  title: Welcome to learning
  image:
    light: /images/wallhaven-wqery6-light.webp
    dark: /images/wallhaven-wqery6-dark.webp
  subtitle:
    text:
      - 记录与分享游戏制作经验

# SEO / 分享卡片（og:description）描述
global:
  open_graph:
    description: 第九艺术俱乐部的博客：记录学习、折腾与作品展示。

# 页脚：博客运行时长从这一天起算（主题默认是主题作者的 2022/8/17）
footer:
  start: 2026/09/30 00:00:00

# 评论：暂时关闭。主题默认是开启的，但 system 指向 waline 的示例地址
# （https://example.example.com），评论区会渲染出来却连不上，所以先关掉。
# 想启用时把 enable 改成 true，选一个 system 并填好自建后端地址，例如：
#   comment:
#     enable: true
#     system: twikoo  # waline, gitalk, twikoo, giscus, utterances, artalk
#     config:
#       twikoo:
#         version: 1.6.10            # 会拼进 cdnjs 地址，别填 cdnjs 上没有的版本
#         server_url: https://你的后端地址
#         region:                    # 腾讯云开发要填地域，其余留空
# 单篇文章关评论：front matter 写 comment: false
# 独立页面默认不显示评论，要显示需在 front matter 写 comments: true
comment:
  enable: false

# RSS：/atom.xml（依赖 hexo-generator-feed，已随 blog/package.json 安装）
plugins:
  feed:
    enable: true
  # Mermaid 图表：开启后 theme 必须是 light/dark 映射，不能写成单个主题名
  # mermaid:
  #   enable: true
  #   version: "11.4.1"
  #   theme:
  #     light: "default"
  #     dark: "dark"
