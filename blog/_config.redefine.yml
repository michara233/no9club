# 主题配置覆盖（Hexo 会把它深度合并到主题自带的 _config.yml 之上）
# 只写需要改的项即可，全部可选项见仓库根目录 _config.yml。

# 站点基本信息（导航栏标题、页脚作者等都用这里）
info:
  title: No9Club
  subtitle: 记录与分享游戏制作经验
  author: 第九艺术数字产品设计俱乐部
  url: https://no9club.pages.dev

# 站点配色：取自俱乐部 logo（近黑底 + 霓虹红 + 琥珀高光）
# 色板出处见文件末尾 inject 段，改色只需要动这两个地方。
colors:
  # 主色 = logo 字母正面的霓虹红。按钮、分页、目录高亮、标签、链接下划线、选中文字都跟它走
  primary: "#E01B2E"
  # 首次访问（没写过 localStorage、也读不到系统偏好）时的兜底色，正常访问会被系统深浅色偏好覆盖
  default_mode: light

# 图片资源：图片放在仓库根目录的主题 source/images/（主题自带图在那里），
# 或者放在 blog/source/images/（站点自己的图），两者构建后都在同一个 /images/ 路径下，配置里统一写 /images/文件名。
# 注意：像 defaults: / home_banner: 这种只写键、子项全被注释掉的写法，会把主题对应的整段配置
# 覆盖成 null，页面会渲染失败（Hexo 只打 ERROR 日志但退出码仍是 0）。要么整段注释，要么至少留一个子项。
defaults:
  # 站点头像（首页侧栏、文章页作者栏）
  avatar: /images/redefine-avatar.png
  # 浏览器标签页图标，默认 /images/redefine-favicon.svg
  favicon: /images/logo.png
  # 导航栏 logo，留空则不显示；填了会出现在站点标题左侧
  # logo: /images/logo.svg

# 首页横幅大图（light / dark 两套，按深浅色模式切换）
#  home_banner:
#   image:
#     light: /images/back.jpg
#     dark: /images/back.jpg

# 分享卡片（og:image）默认图，默认 /images/redefine-og.webp
# global:
#   open_graph:
#     image: /images/og.png

# 导航栏（路径对应 blog/source/ 下的页面，图标用 Font Awesome 类名）
navbar:
  # 导航栏底色渐变：logo 上的深红阴影 -> 霓虹红。
  # transparency 是 10-99 的百分数，越大越不透明（35 是主题默认，这里调到 50，品牌色更明显）
  color:
    left: "#8E0F1B"
    right: "#E01B2E"
    transparency: 50
  links:
    Home:
      path: /
      icon: fa-regular fa-house
    归档:
      path: /archives
      icon: fa-regular fa-archive
    分类:
      path: /categories
      icon: fa-regular fa-folder
    标签:
      path: /tags
      icon: fa-regular fa-tags
  # 站内搜索（本地搜索）：索引由 hexo-generator-searchdb 生成，配置在 blog/_config.yml 的 search 段
  search:
    enable: true
    # 页面加载时预取搜索索引（搜索更快；文章多了想省流量可改 false）
    preload: true

# 首页横幅（hero）的标题、副标题与背景图
# 背景图浅色/深色模式各一张，只想用一张就两张填同一个路径；
# 图片放仓库根目录 source/images/ 或 blog/source/images/ 都行，路径统一写 /images/文件名。
home_banner:
  title: Welcome to learning
  image:
    light: /images/wallhaven-wqery6-light.webp
    dark: /images/wallhaven-wqery6-dark.webp
  subtitle:
    text:
      - 记录与分享游戏制作经验
  # 横幅文字颜色：暖白（和 logo 的高光同一色温），在两个模式下的深色背景图上都清楚
  text_color:
    light: "#FFF4E6"
    dark: "#FFE9CC"

# SEO / 分享卡片（og:description）描述
global:
  open_graph:
    description: 第九艺术俱乐部的博客：记录学习、折腾与作品展示。

# 页脚：博客运行时长从这一天起算（主题默认是主题作者的 2022/8/17）
footer:
  start: 2026/09/30 00:00:00

# 评论：暂时关闭。主题默认是开启的，但 system 指向 waline 的示例地址
# （https://example.example.com），评论区会渲染出来却连不上，所以先关掉。
# 想启用时把 enable 改成 true，选一个 system 并填好自建后端地址，例如：
#   comment:
#     enable: true
#     system: twikoo  # waline, gitalk, twikoo, giscus, utterances, artalk
#     config:
#       twikoo:
#         version: 1.6.10            # 会拼进 cdnjs 地址，别填 cdnjs 上没有的版本
#         server_url: https://你的后端地址
#         region:                    # 腾讯云开发要填地域，其余留空
# 单篇文章关评论：front matter 写 comment: false
# 独立页面默认不显示评论，要显示需在 front matter 写 comments: true
comment:
  enable: false

# RSS：/atom.xml（依赖 hexo-generator-feed，已随 blog/package.json 安装）
plugins:
  feed:
    enable: true
  # Mermaid 图表：开启后 theme 必须是 light/dark 映射，不能写成单个主题名
  # mermaid:
  #   enable: true
  #   version: "11.4.1"
  #   theme:
  #     light: "default"
  #     dark: "dark"

# 全局注入：把品牌配色以 CSS 变量的形式写进每个页面（主题自带的 inject 功能）。
#
# 色板出处：logo2025 —— 近黑底 #0B0B0F、霓虹红 #E01B2E、字母下方的深红 #8E0F1B、
#           描边高光琥珀 #FFC24B、圆环的暗红灰 #3A2B2E。
#
# 为什么用注入、而不是直接改主题的 source/css/common/colors.styl：
#   改主题文件将来合并上游会冲突；注入的这段完全属于站点自己，上游更新不受影响。
# 为什么选择器写成 html:root / html.light / html.dark：
#   主题样式用的是 :root / .light / .dark，而注入点在 <head> 里排在主题样式之前，
#   所以借 html 元素把优先级提高一级（0-1-1 胜过 0-1-0），不受加载顺序影响。
# 这里只覆盖主题里"写死在 CSS 里"的中性色；主色、导航栏渐变、横幅文字色分别由上面的
# colors / navbar.color / home_banner.text_color 控制，改那三项就够了。
inject:
  enable: true
  head:
    - |
      <style id="no9club-palette">
      /* No9Club 品牌配色：浅色用暖白，深色贴近 logo 的近黑，卡片描边取 logo 的红色发丝线 */
      html:root,
      html.light {
        --background-color: #FFF9F6;
        --background-color-transparent: rgba(255, 249, 246, 0.6);
        --background-color-transparent-15: rgba(255, 249, 246, 0.15);
        --background-color-transparent-40: rgba(255, 249, 246, 0.4);
        --background-color-transparent-80: rgba(255, 249, 246, 0.8);
        --second-background-color: #FBF2EE;
        --third-background-color: #F8ECE7;
        --third-background-color-transparent: rgba(248, 236, 231, 0.6);
        --scroll-bar-bg-color: #FBF2EE;
        --default-text-color: #3A3330;
        --first-text-color: #201B19;
        --second-text-color: #2C2624;
        --third-text-color: #6B605C;
        --fourth-text-color: #E7E2DF;
        --invert-text-color: #FFF4E6;
        --avatar-background-color: #E01B2E;
        --copyright-info-color: #C8102E;
        --pjax-progress-bar-color: linear-gradient(90deg, #8E0F1B, #E01B2E 45%, #FFC24B);
      }
      html.dark {
        --background-color: #0B0B0F;
        --background-color-transparent: rgba(11, 11, 15, 0.6);
        --background-color-transparent-15: rgba(11, 11, 15, 0.15);
        --background-color-transparent-40: rgba(11, 11, 15, 0.4);
        --background-color-transparent-80: rgba(11, 11, 15, 0.8);
        --second-background-color: #131318;
        --third-background-color: #1B1B22;
        --third-background-color-transparent: rgba(27, 27, 34, 0.6);
        --scroll-bar-bg-color: #17171C;
        --scrollbar-color: #6E5A5C;
        --scrollbar-color-hover: #8E7679;
        --default-text-color: #C9C3BF;
        --first-text-color: #E6E1DE;
        --second-text-color: #D9D3CF;
        --third-text-color: #9C948F;
        --fourth-text-color: #3B3733;
        --invert-text-color: #12100F;
        --avatar-background-color: #8E0F1B;
        --copyright-info-color: #8E0F1B;
        /* 卡片描边（主题把 --shadow-color-1 用作 0 0 0 1px 的边框）：嫌红就调小这个透明度，改成 0.08 即回到原来的白灰边 */
        --shadow-color-1: rgba(224, 27, 46, 0.26);
        --pjax-progress-bar-color: linear-gradient(90deg, #8E0F1B, #E01B2E 45%, #FFC24B);
      }
      </style>
